<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operation: 24th Birthday for Rawan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d1117; 
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
            position: relative;
            transition: background-color 1s ease;
            font-family: 'Quicksand', sans-serif;
        }

        #gameScreen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            opacity: 1;
            z-index: 999; 
            position: relative;
            transition: opacity 0.8s ease;
        }

        .envelope-container {
            max-width: 600px;
            width: 90%;
            padding: 40px 30px;
            border-radius: 16px;
            background: #161b22;
            border: 2px solid #30363d;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6), inset 0 0 20px rgba(255, 71, 126, 0.1);
            position: relative;
            min-height: 480px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .birthday-message-group {
            font-size: 2rem;
            line-height: 1.3;
            margin-bottom: 25px;
            font-weight: bold;
            z-index: 2;
            font-family: monospace;
        }

        .birthday-age {
            font-size: 5.5rem;
            font-weight: bold;
            color: #ff477e;
            display: block;
            margin: 10px 0;
            text-shadow: 0 0 5px #ff477e, 0 0 10px #ff477e, 0 0 20px #ff477e;
            animation: neon-flicker 1.5s infinite alternate;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px; 
            min-height: 80px;
            width: 100%;
            z-index: 5;
        }

        .btn-group button {
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #yesBtn {
            background-color: #ff477e;
            color: white;
            box-shadow: 0 0 15px rgba(255, 71, 126, 0.4);
        }

        #noBtn {
            background-color: #000000;
            color: #ff477e;
            border: 1px solid #ff477e;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }

        #noBtn.emergency-alert {
            background-color: #d90429 !important;
            color: #ffffff !important;
            border: 2px solid #ffffff !important;
            box-shadow: 0 0 25px #d90429;
            animation: emergencyPulse 0.4s infinite alternate !important;
        }

        #canvasScreen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            opacity: 0;
            z-index: 10;
            transition: opacity 1s ease;
        }

        #cosmicCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .glowing-wishes {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            text-align: center;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .glowing-wishes h1 {
            font-size: 3.2rem;
            color: #ffffff;
            letter-spacing: 4px;
            text-shadow: 0 0 10px #ff477e, 0 0 20px #a371f7, 0 0 40px #58a6ff;
            line-height: 1.6;
        }

        .rocky-trigger-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            z-index: 20;
            margin-top: 10px;
            background: none;
            border: none;
            outline: none;
            position: relative;
        }

        .rocky-wrapper {
            animation: rockyBounce 1.4s infinite ease-in-out;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .rocky-svg {
            width: 220px;
            height: 140px;
            filter: drop-shadow(0 0 10px rgba(255, 112, 150, 0.5));
            transition: transform 0.2s;
        }

        .rocky-trigger-container:hover .rocky-svg {
            transform: scale(1.06);
        }

        .rocky-bubble {
            position: absolute;
            top: -55px;
            background: #ffffff;
            color: #d35400;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 8px 18px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(255, 71, 126, 0.4);
            opacity: 0;
            transform: scale(0.6) translateY(10px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            white-space: nowrap;
        }

        .rocky-bubble::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px 8px 0;
            border-style: solid;
            border-color: #ffffff transparent;
        }

        .rocky-trigger-container:hover .rocky-bubble,
        .rocky-trigger-container:focus .rocky-bubble {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        .neon-arrow-text {
            color: #ff477e;
            font-size: 2.2rem;
            margin-top: -5px;
        }

        #letterScreen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #060211; 
            z-index: 30; 
            justify-content: center;
            align-items: center;
            transform: translateY(100vh); 
            transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1); 
            overflow-y: auto;
            padding: 20px 0;
        }

        #letterScreen.slide-up {
            transform: translateY(0);
        }

        #fireworksCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 31;
            pointer-events: none;
        }

        .letter-container {
            max-width: 650px;
            width: 90%;
            padding: 40px 30px;
            border-radius: 24px;
            background: rgba(15, 10, 30, 0.85); 
            border: 1px solid rgba(163, 113, 247, 0.2);
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.7), 0 0 40px rgba(255, 71, 126, 0.15);
            text-align: center;
            z-index: 32; 
            backdrop-filter: blur(12px);
            margin: auto;
        }

        .letter-title {
            font-family: 'Dancing Script', cursive;
            font-size: 2.2rem;
            color: #ffa6c9;
            margin-bottom: 25px;
            text-shadow: 0 0 15px rgba(255, 112, 150, 0.5);
            line-height: 1.3;
        }

        .letter-body {
            font-family: 'Quicksand', sans-serif;
            font-size: 1.15rem;
            line-height: 1.8;
            color: #e0d0ff; 
            text-align: left;
            direction: ltr;
            font-weight: 400;
            min-height: 150px;
            text-shadow: 0 0 5px rgba(163, 113, 247, 0.3);
        }

        .highlight-text {
            color: #ff477e;
            font-weight: 600;
            text-shadow: 0 0 8px rgba(255, 71, 126, 0.4);
        }

        .cursor {
            display: inline-block;
            width: 3px;
            background-color: #ff477e;
            margin-left: 3px;
            animation: blink 0.75s step-end infinite;
        }

        /* --- Mobile Responsiveness Adjustments --- */
        @media (max-width: 600px) {
            .envelope-container {
                padding: 30px 20px;
                min-height: 400px;
            }
            .birthday-message-group {
                font-size: 1.6rem;
            }
            .birthday-age {
                font-size: 4.2rem;
            }
            .glowing-wishes h1 {
                font-size: 2.2rem;
                letter-spacing: 2px;
            }
            .rocky-svg {
                width: 170px;
                height: 110px;
            }
            .rocky-bubble {
                font-size: 0.95rem;
                top: -45px;
                padding: 6px 12px;
                opacity: 1; /* Always show bubble on touch screens */
                transform: scale(1) translateY(0);
            }
            .letter-container {
                padding: 30px 20px;
                width: 92%;
            }
            .letter-title {
                font-size: 1.8rem;
                margin-bottom: 20px;
            }
            .letter-body {
                font-size: 1rem;
                line-height: 1.6;
            }
            .btn-group button {
                padding: 12px 22px;
                font-size: 1rem;
            }
        }

        @keyframes blink {
            from, to { background-color: transparent }
            50% { background-color: #ff477e; }
        }

        @keyframes neon-flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { text-shadow: 0 0 5px #ff477e, 0 0 10px #ff477e; }
            20%, 24%, 55% { text-shadow: none; color: #a3003b; }
        }

        @keyframes rockyBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(10px); }
        }

        @keyframes emergencyPulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        .cake-container { 
            display: flex; 
            justify-content: center; 
            margin-bottom: 15px; 
            animation: floatCake 3s infinite ease-in-out; 
        }

        @keyframes floatCake {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes candleFlicker {
            0%, 100% { transform: scale(1) rotate(-2deg); opacity: 0.9; }
            50% { transform: scale(1.15) rotate(3deg); opacity: 1; filter: drop-shadow(0 0 10px #ffb703); }
        }
    </style>
</head>
<body>

       <source src="song.mp3" type="audio/mpeg">

    <div id="letterScreen"> 
        <canvas id="fireworksCanvas"></canvas>
        <div class="letter-container">
            <h2 class="letter-title">To the most beautiful girl and my favourite person, Rawan 💖</h2>
            <div class="letter-body" id="typewriterBody"></div>

    <script>
        const noBtn = document.getElementById('noBtn');
        let interactionCount = 0;

        function handleNoButton() {
            interactionCount++;
            if (interactionCount === 1) {
                noBtn.style.position = 'fixed';
                noBtn.style.top = '40px'; noBtn.style.left = '40px';
                noBtn.innerText = "Please Babe! 🥺";
            } else if (interactionCount === 2) {
                noBtn.style.top = 'auto'; noBtn.style.left = 'auto';
                noBtn.style.bottom = '40px'; noBtn.style.right = '40px';
                noBtn.classList.add('emergency-alert');
                noBtn.innerText = "🚨 I will steal Boussa & Safrout! 🐱🔪";
            } else if (interactionCount === 3) {
                noBtn.style.display = 'none';
            }
        }

        function goToCanvasScreen() {
            document.getElementById('bgMusic').play().catch(e => console.log("Music waiting for interaction"));
            
            document.getElementById('gameScreen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('gameScreen').style.display = 'none';
                document.body.style.backgroundColor = '#110924'; 
                const canvasScreen = document.getElementById('canvasScreen');
                canvasScreen.style.display = 'block';
                setTimeout(() => { canvasScreen.style.opacity = '1'; initCanvasEngine(); }, 50);
            }, 800);
        }

        function goToLetterScreen() {
            const letterScreen = document.getElementById('letterScreen');
            letterScreen.style.display = 'flex'; 
            setTimeout(() => {
                letterScreen.classList.add('slide-up');
                initFireworksEngine(); 
                setTimeout(startTypingEffect, 1000);
            }, 20);
        }

        function startTypingEffect() {
            const textContainer = document.getElementById('typewriterBody');
            const content = [
                "Happy 24th Birthday to my favorite long-lost friend, Rawan! 💖",
                "<br><br>",
                "First of all, please forgive me for missing October 5th! I might have shown up a few days late, but finding you again after 7 or 8 whole years is the absolute best plot twist ever. 💕",
                "<br><br>",
                "You know my memory isn't always the best, but I never forgot how special you are to me. You’ve always been the most special and important person to me, from way back then until today. I’m so ridiculously happy we found each other again... and this time, I’m locking the door so you can’t disappear on me again! 🔪 (Say hi to Boussa & Safrout for me! 🐾)",
                "<br><br>",
                "B7bk ♥ and I hope this year brings you all the happiness in the world.",
                "<br><br>",
                "<div style='text-align: right; font-family: Dancing Script, cursive; font-size: 1.5rem; color: #ff477e;'>With all my love, Wael 💖</div>"
            ];

            let currentPart = 0;
            let currentChar = 0;
            textContainer.innerHTML = "<span id='typing-content'></span><span class='cursor'></span>";
            const contentSpan = document.getElementById('typing-content');

            function type() {
                if (currentPart < content.length) {
                    let part = content[currentPart];

                    if (part.startsWith("<")) {
                        contentSpan.innerHTML += part;
                        currentPart++;
                        setTimeout(type, 50);
                    } 
                    else {
                        if (currentChar < part.length) {
                            contentSpan.innerHTML += part.charAt(currentChar);
                            currentChar++;
                            setTimeout(type, 30);
                        } else {
                            currentPart++;
                            currentChar = 0;
                            setTimeout(type, 100);
                        }
                    }
                } else {
                    document.querySelector('.cursor').style.display = 'none';
                }
            }
            type();
        }

        function initCanvasEngine() {
            const canvas = document.getElementById('cosmicCanvas');
            const ctx = canvas.getContext('2d');
            function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
            window.addEventListener('resize', resize); resize();

            const elements = [];
            const palette = ['#ff477e', '#ff7096', '#a371f7', '#58a6ff', '#f72585'];

            class Balloon {
                constructor() { this.reset(); this.y = Math.random() * canvas.height + canvas.height; }
                reset() {
                    this.x = Math.random() * canvas.width; this.y = canvas.height + 50;
                    this.radius = Math.random() * 15 + 20; this.speed = Math.random() * 1.5 + 1;
                    this.color = palette[Math.floor(Math.random() * palette.length)];
                    this.swingSpeed = Math.random() * 0.02 + 0.01; this.swingRange = Math.random() * 30 + 10;
                    this.seed = Math.random() * 100;
                }
                update() { this.y -= this.speed; this.seed += this.swingSpeed; this.currentX = this.x + Math.sin(this.seed) * this.swingRange; if (this.y < -60) this.reset(); }
                draw() {
                    ctx.save(); ctx.beginPath(); ctx.shadowBlur = 15; ctx.shadowColor = this.color;
                    ctx.fillStyle = this.color; ctx.ellipse(this.currentX, this.y, this.radius * 0.85, this.radius, 0, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.moveTo(this.currentX, this.y + this.radius); ctx.lineTo(this.currentX - 5, this.y + this.radius + 6); ctx.lineTo(this.currentX + 5, this.y + this.radius + 6); ctx.closePath(); ctx.fillStyle = this.color; ctx.fill();
                    ctx.beginPath(); ctx.moveTo(this.currentX, this.y + this.radius + 6); ctx.quadraticCurveTo(this.currentX - 5, this.y + this.radius + 20, this.currentX, this.y + this.radius + 40); ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)'; ctx.lineWidth = 1.5; ctx.stroke(); ctx.restore();
                }
            }

            class Sparkle {
                constructor() { this.reset(); }
                reset() { this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height; this.size = Math.random() * 2 + 1; this.alpha = Math.random(); this.speed = Math.random() * 0.02 + 0.01; }
                update() { this.alpha += this.speed; if (this.alpha > 1 || this.alpha < 0) this.speed = -this.speed; }
                draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(this.alpha)})`; ctx.fill(); }
            }

            for (let i = 0; i < 22; i++) elements.push(new Balloon());
            for (let i = 0; i < 60; i++) elements.push(new Sparkle());

            function animate() {
                ctx.fillStyle = 'rgba(17, 9, 36, 0.2)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                elements.forEach(el => { el.update(); el.draw(); });
                requestAnimationFrame(animate);
            }
            animate();
        }

        function initFireworksEngine() {
            const canvas = document.getElementById('fireworksCanvas');
            const ctx = canvas.getContext('2d');
            function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
            window.addEventListener('resize', resize); resize();

            let fireworks = []; let particles = [];
            const colors = ['#ff477e', '#ff7096', '#a371f7', '#58a6ff', '#ffb703', '#00f5d4'];

            class Rocket {
                constructor() { this.x = Math.random() * canvas.width; this.y = canvas.height; this.targetY = Math.random() * (canvas.height * 0.5) + canvas.height * 0.1; this.speed = Math.random() * 4 + 4; this.color = colors[Math.floor(Math.random() * colors.length)]; }
                update() { this.y -= this.speed; if (this.y <= this.targetY) { explode(this.x, this.y, this.color); return false; } return true; }
                draw() { ctx.save(); ctx.beginPath(); ctx.arc(this.x, this.y, 3, 0, Math.PI * 2); ctx.fillStyle = this.color; ctx.shadowBlur = 10; ctx.shadowColor = this.color; ctx.fill(); ctx.restore(); }
            }

            class Particle {
                constructor(x, y, color) { this.x = x; this.y = y; this.color = color; this.angle = Math.random() * Math.PI * 2; this.velocity = Math.random() * 3 + 1; this.gravity = 0.05; this.alpha = 1; this.decay = Math.random() * 0.015 + 0.01; }
                update() { this.x += Math.cos(this.angle) * this.velocity; this.y += Math.sin(this.angle) * this.velocity + this.gravity; this.alpha -= this.decay; return this.alpha > 0; }
                draw() { ctx.save(); ctx.globalAlpha = this.alpha; ctx.beginPath(); ctx.arc(this.x, this.y, 2, 0, Math.PI * 2); ctx.fillStyle = this.color; ctx.shadowBlur = 8; ctx.shadowColor = this.color; ctx.fill(); ctx.restore(); }
            }

            function explode(x, y, color) { for (let i = 0; i < 35; i++) particles.push(new Particle(x, y, color)); }

            function render() {
                ctx.fillStyle = 'rgba(6, 2, 17, 0.25)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                if (Math.random() < 0.04 && fireworks.length < 5) fireworks.push(new Rocket());
                fireworks = fireworks.filter(r => { if (r.update()) r.draw(); return r.y > r.targetY; });
                particles = particles.filter(p => { if (p.update()) p.draw(); return p.alpha > 0; });
                requestAnimationFrame(render);
            }
            render();
        }
    </script>
</body>
</html>
